name: Client CI/CD

on:
  push:
    branches: [dev]
    paths:
      - 'client/**'
      - '.github/workflows/client-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Trigger Vercel deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret is not set (repo Settings > Secrets and variables > Actions)."
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
